name: Build Aseprite for Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Get latest stable Aseprite version
        id: version
        shell: pwsh
        run: |
          $release = Invoke-RestMethod https://api.github.com/repos/aseprite/aseprite/releases/latest
          "tag=$($release.tag_name)" >> $env:GITHUB_OUTPUT
      - name: Download official source and Skia
        shell: pwsh
        env:
          ASEPRITE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git clone --depth 1 --shallow-submodules --recurse-submodules -j8 --branch $env:ASEPRITE_TAG https://github.com/aseprite/aseprite.git aseprite
          if ($LASTEXITCODE -ne 0) { throw "Source download failed" }
          Invoke-WebRequest https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip -OutFile skia.zip
          Expand-Archive skia.zip -DestinationPath aseprite/skia
      - uses: aseprite/get-ninja@main
      - uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Configure and compile
        shell: pwsh
        working-directory: aseprite
        run: |
          $skia = (Resolve-Path skia).Path
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTS=OFF -DENABLE_I18N_STRINGS=ON -DENABLE_SCRIPTING=ON -DENABLE_CCACHE=OFF -DLAF_BACKEND=skia "-DSKIA_DIR=$skia" "-DSKIA_LIBRARY_DIR=$skia/out/Release-x64" "-DSKIA_LIBRARY=$skia/out/Release-x64/skia.lib"
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed" }
          cmake --build build --target aseprite --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Compilation failed" }
      - name: Package portable app
        id: package
        shell: pwsh
        env:
          ASEPRITE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Path portable | Out-Null
          Copy-Item aseprite/build/bin/aseprite.exe portable/
          Copy-Item aseprite/build/bin/data portable/data -Recurse
          if (Test-Path portable/data/strings.git/.git) { Remove-Item portable/data/strings.git/.git -Recurse -Force }
          "# Portable Aseprite configuration" | Set-Content portable/aseprite.ini -Encoding ascii
          Compress-Archive -Path portable/* -DestinationPath "Aseprite-$env:ASEPRITE_TAG-Windows-x64.zip"
      - name: Verify packaged executable
        shell: pwsh
        env:
          ASEPRITE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $exe = (Resolve-Path portable/aseprite.exe).Path
          $process = Start-Process -FilePath $exe -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput version.txt -RedirectStandardError version-error.txt
          $version = Get-Content version.txt -Raw
          Write-Output $version
          Write-Output "Exit code: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) { Get-Content version-error.txt; throw "Executable exited with an error" }
          if ($version -notmatch ('Aseprite ' + [regex]::Escape($env:ASEPRITE_TAG.TrimStart('v')))) { throw "Unexpected version output" }
      - name: Save personal build download
        if: ${{ always() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: Aseprite-Windows-x64
          path: Aseprite-*-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
